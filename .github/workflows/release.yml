name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON_DOWNLOADS: never
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONIOENCODING: utf-8
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate formal version
        if: github.event_name == 'push'
        run: python -m scripts.release version --tag "$RELEASE_TAG"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.17
          uv sync --locked --group build --python 3.12
      - name: Compile
        run: .venv/Scripts/python.exe build.py
      - name: Package tagged release
        if: github.event_name == 'push'
        run: .venv/Scripts/python.exe -m scripts.release package --tag "$RELEASE_TAG"
      - name: Package trial
        if: github.event_name == 'workflow_dispatch'
        run: .venv/Scripts/python.exe -m scripts.release package --trial "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Check standalone executable and first-run config
        run: |
          .venv/Scripts/python.exe -m scripts.check_windows dist/windows-release --runner-temp "$RUNNER_TEMP"
      - name: Artifact name
        id: names
        run: echo "artifact=windows-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: dist/windows-release/
          if-no-files-found: error
          retention-days: 30

  draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist/windows-release
      - name: Create or resume draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m scripts.publish_release --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --directory dist/windows-release
